<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasköy CADEP - Giriş Yap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-white">Hasköy CADEP</h1>
            <p class="text-sm text-slate-400">Canik Akademik Destek Programı Takip Otomasyonu</p>
        </div>

        <form id="giris-form" onsubmit="sistemeGirisYap(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Kullanıcı Adı / Okul No</label>
                <input type="text" id="kullanici-adi" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Kullanıcı adınızı veya numaranızı girin">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Şifre</label>
                <input type="password" id="sifre" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Şifrenizi girin">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg transition text-sm cursor-pointer">
                Giriş Yap
            </button>
        </form>

        <div id="hata-mesaji" class="hidden bg-red-900/50 border border-red-700 text-red-200 text-xs p-3 rounded-lg text-center font-medium"></div>

        <div class="text-center pt-4 border-t border-slate-700/60 text-xs text-slate-500">
            Hasköy Ortaokulu &copy; 2026
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dsiiujfqcrqochyutnsz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_y8ImQZ7mMvcx0XgDd5_zAQ_UzMEludA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function sistemeGirisYap(e) {
            e.preventDefault();
            let kullaniciAdi = document.getElementById('kullanici-adi').value.trim();
            let sifre = document.getElementById('sifre').value.trim();
            let hataDiv = document.getElementById('hata-mesaji');
            
            hataDiv.classList.add('hidden');

            // 1. Kullanıcılar tablosundan kontrol et
            let { data: kulData, error } = await _supabase
                .from('kullanicilar')
                .select('*')
                .eq('kullanici_adi', kullaniciAdi)
                .eq('sifre', sifre)
                .maybeSingle();

            if (kulData) {
                // Oturum bilgilerini localStorage'a kaydet
                let oturumBilgisi = {
                    id: kulData.id,
                    kullanici_adi: kulData.kullanici_adi,
                    rol: kulData.rol || 'ogrenci', // admin, mihmandar, ogrenci, gozlemci
                    iliskili_id: kulData.iliskili_id
                };
                localStorage.setItem('cadep_oturum', JSON.stringify(oturumBilgisi));

                // Rolüne göre yönlendir
                if (kulData.rol === 'gozlemci') {
                    window.location.href = 'index.html';
                } else if (kulData.rol === 'admin') {
                    window.location.href = 'index.html';
                } else if (kulData.rol === 'mihmandar') {
                    window.location.href = `mihmandar_detay.html?id=${kulData.iliskili_id || ''}`;
                } else {
                    window.location.href = `ogrenci_detay.html?id=${kulData.iliskili_id || ''}`;
                }
                return;
            }

            // 2. Eğer kullanıcılar tablosunda bulunamadıysa direkt öğrenci tablosundan (okul no / öğrenci no ile) kontrol et
            let { data: ogrData } = await _supabase
                .from('cadep_ogrenciler')
                .select('*')
                .or(`ogrenci_no.eq.${kullaniciAdi},okul_no.eq.${kullaniciAdi}`)
                .maybeSingle();

            if (ogrData && sifre === "1234") { // Öğrenciler için varsayılan şifre kuralı
                let oturumBilgisi = {
                    id: ogrData.id,
                    kullanici_adi: ogrData.ogrenci_no || ogrData.okul_no,
                    rol: 'ogrenci',
                    iliskili_id: ogrData.id
                };
                localStorage.setItem('cadep_oturum', JSON.stringify(oturumBilgisi));
                window.location.href = `ogrenci_detay.html?id=${ogrData.id}`;
                return;
            }

            // Hatalı giriş
            hataDiv.innerText = "Kullanıcı adı veya şifre hatalı!";
            hataDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
