<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasköy CADEP - Sınıf ve Grup Kazanım Analizi</title>
    <script>
        let oturum = JSON.parse(localStorage.getItem('cadep_oturum'));
        // Eğer oturum yoksa giriş sayfasına, öğrenci ise kendi detay sayfasına yönlendir
        if (!oturum) {
            window.location.href = 'giris.html';
        } else if (oturum.rol === 'ogrenci') {
            window.location.href = 'ogrenci_detay.html';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">Hasköy CADEP Takip Sistemi</h1>
                <p class="text-indigo-200 text-sm">Sınıf Geneli Madde ve Kazanım Analizi Raporu</p>
            </div>
            <nav class="mt-3 sm:mt-0 flex flex-wrap gap-2 items-center">
                <a href="denemeler.html" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-2 rounded-lg text-sm font-medium transition shadow-inner border border-indigo-600">← Denemelere Dön</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2">
                <span>📊</span> Deneme Sınavı Kazanım Analizi
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Deneme Sınavı</label>
                    <select id="deneme-sec" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 cursor-pointer" onchange="analiziGetir()">
                        <option value="">Deneme Seçiniz...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Sınıf / Grup Filtresi</label>
                    <select id="sinif-sec" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 cursor-pointer" onchange="analiziGetir()">
                        <option value="TUM">Tüm Okul (Genel Analiz)</option>
                    </select>
                </div>
                <div id="istatistik-ozet" class="hidden bg-indigo-50 border border-indigo-100 p-3 rounded-lg text-indigo-800 font-medium text-sm flex justify-between items-center h-[46px]">
                    <span>Katılımcı Sayısı: <b id="katilimci-sayisi" class="text-lg">0</b></span>
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded shadow text-xs font-bold transition">Yazdır</button>
                </div>
            </div>
        </div>

        <div id="analiz-yukleniyor" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-700 mb-2"></div>
            <p class="text-slate-500 font-medium text-sm">Analiz hesaplanıyor...</p>
        </div>

        <div id="analiz-kapsayici" class="space-y-6 hidden">
            <!-- Derslerin analiz tabloları buraya JavaScript ile eklenecek -->
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        Hasköy Akademik Destek Programı (CADEP) Takip Otomasyonu &copy; 2026 - Hasköy Ortaokulu
    </footer>

    <script>
        const SUPABASE_URL = 'https://dsiiujfqcrqochyutnsz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_y8ImQZ7mMvcx0XgDd5_zAQ_UzMEludA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tumOgrenciler = [];

        window.onload = async function() {
            let { data: denemeler } = await _supabase.from('denemeler').select('id, deneme_adi, tarih').order('tarih', { ascending: false });
            let denemeSelect = document.getElementById('deneme-sec');
            if(denemeler) {
                denemeler.forEach(d => {
                    denemeSelect.innerHTML += `<option value="${d.id}">${d.deneme_adi} (${d.tarih})</option>`;
                });
            }

            let { data: ogrData } = await _supabase.from('cadep_ogrenciler').select('id, sinif');
            if (ogrData) {
                tumOgrenciler = ogrData;
                let benzersizSiniflar = [...new Set(ogrData.map(o => o.sinif).filter(Boolean))].sort();
                let sinifSelect = document.getElementById('sinif-sec');
                benzersizSiniflar.forEach(s => {
                    sinifSelect.innerHTML += `<option value="${s}">${s} Sınıfı</option>`;
                });
            }
        };

        async function analiziGetir() {
            let denemeId = document.getElementById('deneme-sec').value;
            let seciliSinif = document.getElementById('sinif-sec').value;
            let kapsayici = document.getElementById('analiz-kapsayici');
            let yukleniyor = document.getElementById('analiz-yukleniyor');
            let ozet = document.getElementById('istatistik-ozet');

            if (!denemeId) {
                kapsayici.classList.add('hidden');
                ozet.classList.add('hidden');
                return;
            }

            kapsayici.classList.add('hidden');
            ozet.classList.add('hidden');
            yukleniyor.classList.remove('hidden');

            let hedefOgrenciIdleri = tumOgrenciler
                .filter(o => seciliSinif === 'TUM' || o.sinif === seciliSinif)
                .map(o => o.id);

            let { data: sonuclarDb } = await _supabase.from('deneme_sonuclari').select('ogrenci_id').eq('deneme_id', denemeId);
            
            let sonuclar = (sonuclarDb || []).filter(s => hedefOgrenciIdleri.includes(s.ogrenci_id));
            let toplamOgrenci = sonuclar.length;

            if (toplamOgrenci === 0) {
                yukleniyor.classList.add('hidden');
                kapsayici.innerHTML = `<div class="bg-amber-50 text-amber-700 p-4 rounded-xl text-center border border-amber-200 shadow-sm font-medium">Seçili deneme ve sınıf kriterine uygun katılımcı verisi bulunamadı.</div>`;
                kapsayici.classList.remove('hidden');
                return;
            }

            document.getElementById('katilimci-sayisi').innerText = toplamOgrenci;

            let { data: harita } = await _supabase.from('cadep_deneme_soru_haritasi').select('*').eq('deneme_id', denemeId).eq('kitapcik_turu', 'A');
            
            let { data: eksiklerDb } = await _supabase.from('cadep_ogrenci_kazanim_analizi').select('kazanim_id, ogrenci_id').eq('deneme_id', denemeId);
            let eksikler = (eksiklerDb || []).filter(e => hedefOgrenciIdleri.includes(e.ogrenci_id));
            
            let { data: kazanimlarDb } = await _supabase.from('cadep_kazanimlar').select('*');

            let dersAnalizleri = {};

            harita.forEach(soru => {
                if (!soru.kazanim_id) return;
                
                let dersAdi = soru.ders_adi || 'Diğer';
                if (!dersAnalizleri[dersAdi]) {
                    dersAnalizleri[dersAdi] = {};
                }

                if (!dersAnalizleri[dersAdi][soru.kazanim_id]) {
                    let kDetay = kazanimlarDb.find(k => k.id === soru.kazanim_id);
                    let kMetin = kDetay ? (kDetay.kazanim_adi || kDetay.kazanim_metni || kDetay.metin || kDetay.kazanim || 'Tanımsız Kazanım (ID: ' + soru.kazanim_id + ')') : 'Bilinmeyen Kazanım';
                    
                    dersAnalizleri[dersAdi][soru.kazanim_id] = {
                        metin: kMetin,
                        soruSayisi: 0,
                        toplamHata: 0
                    };
                }
                
                dersAnalizleri[dersAdi][soru.kazanim_id].soruSayisi += 1;
            });

            eksikler.forEach(eksik => {
                for (let ders in dersAnalizleri) {
                    if (dersAnalizleri[ders][eksik.kazanim_id]) {
                        dersAnalizleri[ders][eksik.kazanim_id].toplamHata += 1;
                    }
                }
            });

            let html = '';
            let dersSirasi = ["Türkçe", "Matematik", "Fen Bilimleri", "T.C. İnkılap Tarihi", "Din Kültürü", "İngilizce"];

            dersSirasi.forEach(ders => {
                if (!dersAnalizleri[ders]) return;

                let konular = Object.values(dersAnalizleri[ders]);
                konular.sort((a, b) => {
                    let aYuzde = ((toplamOgrenci * a.soruSayisi) - a.toplamHata) / (toplamOgrenci * a.soruSayisi);
                    let bYuzde = ((toplamOgrenci * b.soruSayisi) - b.toplamHata) / (toplamOgrenci * b.soruSayisi);
                    return aYuzde - bYuzde; 
                });

                html += `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6 page-break-inside-avoid">
                    <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-bold text-slate-700 text-lg flex items-center gap-2"><span class="text-indigo-600">▪</span> ${ders} Sınıf Analizi</h3>
                        <span class="text-xs bg-indigo-100 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-full font-bold shadow-inner">${seciliSinif === 'TUM' ? 'Tüm Okul' : seciliSinif + ' Sınıfı'}</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="p-3 w-1/2">Kazanım / Konu</th>
                                    <th class="p-3 text-center">Soru Sayısı</th>
                                    <th class="p-3 text-center">Doğru Yapan</th>
                                    <th class="p-3 text-center">Yanlış/Boş</th>
                                    <th class="p-3 text-left w-56">Grup Başarısı</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                `;

                konular.forEach(k => {
                    let toplamOlasilik = toplamOgrenci * k.soruSayisi;
                    let dogruSayisi = toplamOlasilik - k.toplamHata;
                    let basariOrani = Math.round((dogruSayisi / toplamOlasilik) * 100);
                    
                    let renkClass = 'bg-emerald-500';
                    if (basariOrani < 50) renkClass = 'bg-red-500';
                    else if (basariOrani < 75) renkClass = 'bg-amber-400';

                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-3 text-slate-700 font-medium leading-tight">${k.metin}</td>
                            <td class="p-3 text-center text-slate-500">${k.soruSayisi} Soru</td>
                            <td class="p-3 text-center font-bold text-emerald-600">${dogruSayisi}</td>
                            <td class="p-3 text-center font-bold text-red-500">${k.toplamHata}</td>
                            <td class="p-3">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold w-10 text-right ${basariOrani < 50 ? 'text-red-600' : (basariOrani < 75 ? 'text-amber-600' : 'text-emerald-600')}">%${basariOrani}</span>
                                    <div class="w-full bg-slate-200 rounded-full h-2.5 shadow-inner">
                                        <div class="${renkClass} h-2.5 rounded-full" style="width: ${basariOrani}%"></div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`;
            });

            yukleniyor.classList.add('hidden');
            
            if (html === '') {
                kapsayici.innerHTML = `<div class="text-center text-slate-500 py-6 border border-slate-200 rounded-xl bg-slate-50 font-medium">Bu deneme için kazanım haritası (cevap anahtarı) girilmemiş. Lütfen 'Kazanım Yönetimi' sayfasından soruları tanımlayın.</div>`;
            } else {
                kapsayici.innerHTML = html;
                ozet.classList.remove('hidden');
            }
            kapsayici.classList.remove('hidden');
        }
    </script>
    <style>
        @media print {
            body { background-color: white; }
            header, nav, button, select, label { display: none !important; }
            .shadow-sm, .shadow-md { box-shadow: none !important; border: 1px solid #ddd; }
            .page-break-inside-avoid { break-inside: avoid; }
        }
    </style>
</body>
</html>
